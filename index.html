<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b3a4f">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f3f5;--card:#fff;--tx:#1a202c;--mut:#5f6b7a;--ac:#2b3a4f;--acb:#e9ecf0;--bd:#d3d8de;--warn:#8a3b12;--warnb:#f7ebe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#181d25;--tx:#e6e8eb;--mut:#9aa3af;--ac:#4f6a8a;--acb:#232b37;--bd:#2a323d;--warn:#d9a070;--warnb:#33281f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--card:#181d25;--tx:#e6e8eb;--mut:#9aa3af;--ac:#4f6a8a;--acb:#232b37;--bd:#2a323d;--warn:#d9a070;--warnb:#33281f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.02em}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ac);padding:4px 0 10px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--mut)}
.btn{padding:9px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.s{padding:5px 10px;font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:var(--acb);color:var(--ac)}
.pill.w{background:var(--warnb);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px}
.stat b{display:block;font-size:19px}.stat{border-top:3px solid var(--ac)}.card{box-shadow:none}
.notes{white-space:pre-wrap;margin:6px 0}
.tw{overflow-x:auto}
.hide{display:none}.ttl{font-size:20px;font-weight:700;border:0;border-bottom:1px dashed var(--bd);border-radius:0;background:transparent;padding:4px 0;margin:0 0 2px}mark{background:var(--acb);color:var(--tx);padding:0 2px;border-radius:3px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:10px}.ch{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}.cd{min-height:66px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px}.cd span{font-size:13px;font-weight:600}.cd small{font-size:10px;background:var(--acb);color:var(--ac);border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd.td span{color:#fff;background:var(--ac);border-radius:99px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}.cd.sel{outline:2px solid var(--ac)}.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.fl>div{flex:1;min-width:130px}.fl input{margin-bottom:0}
#st{font-size:12px;color:var(--mut);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="w">
<div class="hd"><h1>📒 Koç Takip</h1><button class="btn g s" id="setbtn" style="display:none" data-a="settings">⚙ Ayarlar</button></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<div id="st"></div>
</div>
<script>
var S={students:[],sessions:[],payments:[],plans:[],exc:[]},view="students",sel=null,store=null,uid=null,SF="",WK=0,ED=null,PRE=null,SLO=false,CH=null,MV="",Q="",SV="a",MO=new Date().getFullYear()*12+new Date().getMonth(),SD=today(),F={from:"",to:""};
var TABS=[["students","Öğrenciler"],["cal","Takvim"],["money","Muhasebe"]];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uidn(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tl(n){return (Number(n)||0).toLocaleString("tr-TR")+" ₺"}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function fd(s){if(!s)return"";var p=s.split("-");return p[2]+"."+p[1]+"."+p[0]}
function sname(id){var s=S.students.find(function(x){return x.id==id});return s?s.name:"(silinmiş)"}
function status(t){$("st").textContent=t}
function sum(l){return l.reduce(function(a,x){return a+(+(x.fee!=null?x.fee:x.amount)||0)},0)}
function inR(d){return(!F.from||d>=F.from)&&(!F.to||d<=F.to)}
function setRange(r){var n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(r=="month"){F.from=ymd(new Date(y,m,1));F.to=ymd(new Date(y,m+1,0))}
  else if(r=="prev"){F.from=ymd(new Date(y,m-1,1));F.to=ymd(new Date(y,m,0))}
  else if(r=="year"){F.from=y+"-01-01";F.to=y+"-12-31"}
  else{F.from="";F.to=""}}
setRange("month");

var PAYO=false,PASO=false;
document.addEventListener("toggle",function(e){if(e.target&&e.target.id=="payd")PAYO=e.target.open;if(e.target&&e.target.id=="pasd")PASO=e.target.open},true);
var KEYS=["students","sessions","payments","plans","exc"];
var fbAuth=null,db=null,USER=null,last={},pend={},got={},ready=false,shown=false,dirty=false,tm=null,unsubs=[];
KEYS.forEach(function(k){last[k]={}});
function showMsg(m){$("tabs").innerHTML="";$("app").innerHTML='<div class="card">'+m+'</div>'}
function showLogin(){$("tabs").innerHTML="";status("");$("app").innerHTML='<div class="card"><h2>Giriş yap</h2><label>Kullanıcı adı</label><input id="le" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Şifre</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" data-a="login">Giriş yap</button></div>'}
function authMsg(er){var c=er&&er.code||"";if(/invalid-credential|user-not-found|wrong-password|invalid-email/.test(c))return"Kullanıcı adı veya şifre hatalı.";if(c=="auth/too-many-requests")return"Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.";if(c=="auth/network-request-failed")return"İnternet bağlantısı yok.";return"Giriş yapılamadı ("+c+")"}
function uname(v){v=String(v||"").trim().toLowerCase();return v.indexOf("@")>=0?v:v+"@kocluk.com"}
async function doLogin(){var e=uname($("le").value),p=$("lp").value;if(!$("le").value.trim()||!p)return toast("Kullanıcı adı ve şifre gir.");try{await fbAuth.signInWithEmailAndPassword(e,p)}catch(er){toast(authMsg(er))}}
async function doReset(){var e=$("le").value.trim();if(!e)return toast("Önce e-posta adresini yaz.");try{await fbAuth.sendPasswordResetEmail(e);toast("Şifre sıfırlama e-postası gönderildi.")}catch(er){toast(authMsg(er))}}
function init(){
  var c=window.FIREBASE_CONFIG;
  if(!window.firebase||!c||!c.apiKey||/BURAYA/.test(c.apiKey)){showMsg("Firebase ayarları girilmemiş. <b>firebase-config.js</b> dosyasını KURULUM.md'deki adımlara göre doldur.");return}
  firebase.initializeApp(c);fbAuth=firebase.auth();db=firebase.firestore();
  fbAuth.onAuthStateChanged(function(u){USER=u;if(u)start();else{stop();showLogin()}});
}
function start(){got={};ready=false;shown=false;status("Bağlanıyor…");$("setbtn").style.display="";
  KEYS.forEach(function(k){unsubs.push(db.collection(k).onSnapshot(function(snap){if(dirty){pend[k]=snap;return}take(k,snap)},function(err){status("Veri okunamadı: "+err.code);toast("Veriler okunamadı. Bu hesabın yetkisi olmayabilir ("+err.code+").")}))})}
function stop(){unsubs.forEach(function(u){u()});unsubs=[];S={students:[],sessions:[],payments:[],plans:[],exc:[]};KEYS.forEach(function(k){last[k]={}});pend={};got={};ready=false;shown=false;dirty=false;clearTimeout(tm);tm=null;$("setbtn").style.display="none";view="students";sel=null}
function take(k,snap){
  var arr=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
  S[k]=arr;last[k]={};arr.forEach(function(o){last[k][o.id]=JSON.stringify(o)});
  got[k]=true;if(!KEYS.every(function(x){return got[x]}))return;
  ready=true;status("Bağlı ✓ ortak kayıt");
  var f=document.activeElement;
  if(shown&&f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName)&&$("app").contains(f))return;
  shown=true;render();
}
function save(){if(!db||!USER)return;dirty=true;clearTimeout(tm);tm=setTimeout(function(){tm=null;flush()},500)}
async function flush(){
  if(!db||!USER){dirty=false;return}
  var ops=[],i;
  KEYS.forEach(function(k){
    var cur={};(S[k]||[]).forEach(function(x){if(x.id!=null)cur[String(x.id)]=JSON.stringify(x)});
    Object.keys(cur).forEach(function(id){if(last[k][id]!==cur[id])ops.push({k:k,id:id,str:cur[id]})});
    Object.keys(last[k]).forEach(function(id){if(!(id in cur))ops.push({k:k,id:id,del:true})});
  });
  try{
    for(i=0;i<ops.length;i+=400){
      var b=db.batch();
      ops.slice(i,i+400).forEach(function(o){var r=db.collection(o.k).doc(o.id);if(o.del)b.delete(r);else{var d=JSON.parse(o.str);d.id=o.id;b.set(r,d)}});
      await b.commit();
    }
    ops.forEach(function(o){if(o.del)delete last[o.k][o.id];else last[o.k][o.id]=o.str});
    status("Kaydedildi ✓");
  }catch(e){
    status("Kaydedilemedi: "+(e.code||e.message));toast("Kaydedilemedi. İnternet ya da yetki sorunu olabilir, tekrar deneniyor.");
    clearTimeout(tm);tm=setTimeout(function(){tm=null;flush()},5000);return;
  }
  dirty=!!tm;
  if(!dirty){var p=pend;pend={};Object.keys(p).forEach(function(k){take(k,p[k])})}
}
var LK="";function top0(){window.scrollTo(0,0);document.documentElement.scrollTop=0;var h=document.querySelector(".hd");if(h)h.scrollIntoView({block:"start"})}
function render(){var k=view+"|"+sel;if(k!=LK){LK=k;Q="";setTimeout(top0,30)}
  $("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(view==t[0]?"on":"")+'" data-v="'+t[0]+'">'+t[1]+'</button>'}).join("");
  var a=$("app");
  if(view=="students")a.innerHTML=sel?studentDetail():studentList();
  else if(view=="sessions"){if(SF&&!S.students.some(function(x){return x.id==SF}))SF="";var fl=S.sessions.filter(function(x){return !SF||x.studentId==SF});a.innerHTML=sessionForm(null)+'<h2>Seanslar</h2><div class="card"><label>Öğrenciye göre filtrele</label><select id="sfl"><option value="">Tüm öğrenciler</option>'+S.students.map(function(x){return '<option value="'+x.id+'"'+(x.id==SF?' selected':'')+'>'+esc(x.name)+'</option>'}).join("")+'</select><span class="mut">'+fl.length+' seans · '+tl(sum(fl))+'</span></div>'+sessionList(fl,true)}
  else if(view=="settings")a.innerHTML='<button class="btn g s" data-a="closeSet">← Geri</button><div style="margin-top:10px"><div class="card"><h2>Hesap</h2><p class="mut">'+esc(USER?(USER.email||"").replace("@kocluk.com",""):"")+'</p><button class="btn g s" data-a="logout">Çıkış yap</button></div>'+backupCard()+'</div>';else if(view=="cal")a.innerHTML=calendar();else a.innerHTML=money();
}
function bal(id){return sum(S.sessions.filter(function(x){return x.studentId==id}))-sum(S.payments.filter(function(x){return x.studentId==id}))}
function balPill(b){return b>0?'<span class="pill w">Kalan '+tl(b)+'</span>':b<0?'<span class="pill">Fazla ödeme '+tl(-b)+'</span>':'<span class="pill">Güncel</span>'}

function studentList(){
  var h='<div class="stat" style="margin-bottom:10px"><span class="mut">Toplam yapılan seans</span><b>'+S.sessions.length+'</b></div><details class="card"><summary style="cursor:pointer;font-weight:600">+ Yeni öğrenci ekle</summary><div style="height:10px"></div><label>Ad soyad</label><input id="sn"><label>Seans ücreti (₺)</label><input id="sf" type="number" inputmode="decimal"><button class="btn" data-a="addStu">Ekle</button></details>';
  if(!S.students.length)return h+'<p class="mut">Henüz öğrenci yok. Yukarıdan ilk öğrenciyi ekle.</p>';
  var act=S.students.filter(function(s){return s.active!==false}),pas=S.students.filter(function(s){return s.active===false});
  function card(s){var n=S.sessions.filter(function(x){return x.studentId==s.id}).length;
    return '<div class="card" data-a="open" data-id="'+s.id+'" style="cursor:pointer"><div class="row"><div><b>'+esc(s.name)+'</b><div class="mut">'+n+' seans yapıldı</div></div><div><button class="btn g s" data-a="open" data-id="'+s.id+'">Aç</button></div></div></div>'}
  h+='<select id="svs" style="font-weight:600;font-size:17px"><option value="a"'+(SV!="p"?' selected':'')+'>Aktif öğrenciler ('+act.length+')</option><option value="p"'+(SV=="p"?' selected':'')+'>Pasif öğrenciler ('+pas.length+')</option></select>';
  var lst=SV=="p"?pas:act;
  h+=lst.length?lst.map(card).join(""):'<p class="mut">'+(SV=="p"?"Pasif öğrenci yok.":"Aktif öğrenci yok.")+'</p>';
  return h;
}
function studentDetail(){
  var s=S.students.find(function(x){return x.id==sel});if(!s){sel=null;return studentList()}
  var ss=S.sessions.filter(function(x){return x.studentId==s.id}),ps=S.payments.filter(function(x){return x.studentId==s.id});
  return '<button class="btn g s" data-a="back">← Geri</button><div class="card" style="margin-top:10px"><input id="en" class="ttl" value="'+esc(s.name)+'" aria-label="Ad soyad"><div class="mut" style="margin:2px 0 10px">'+ss.length+' seans yapıldı'+(s.active===false?' · <span class="pill w">Pasif</span>':'')+'</div>'+slotsHtml(s)+'<details style="margin:4px 0 10px"><summary style="cursor:pointer;padding:6px 0;font-weight:600">Öğrenci notu'+(s.note?' •':'')+'</summary><textarea id="gn">'+esc(s.note||"")+'</textarea></details><div class="row"><button class="btn s" data-a="saveNote">Notu kaydet</button><button class="btn g s" data-a="toggleAct">'+(s.active===false?"Aktif yap":"Pasif yap")+'</button> <button class="btn g s" data-a="delStu">Öğrenciyi sil</button></div></div>'+'<h2>Seans geçmişi ('+ss.length+')</h2>'+'<input id="q" type="search" placeholder="🔍 Bu öğrencinin seans notlarında ara..." value="'+esc(Q)+'"><div id="sres">'+sres(ss)+'</div>'+sessionForm(s);
}
function payForm(s){
  var sel2=s?'<input type="hidden" id="ps" value="'+s.id+'">':'<label>Öğrenci</label><select id="ps">'+S.students.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join("")+'</select>';
  if(!S.students.length)return"";
  return '<details class="card"><summary style="cursor:pointer;font-weight:600">+ Ödeme al</summary><div style="height:10px"></div>'+sel2+'<div class="fl"><div><label>Tutar (₺)</label><input id="pa" type="number" inputmode="decimal"></div><div><label>Tarih</label><input id="pd" type="date" value="'+today()+'"></div></div><label>Not (nakit, havale...)</label><input id="pn"><button class="btn" data-a="addPay">Ödemeyi kaydet</button></details>';
}
function payList(list,showName,form){
  form=form||"";
  if(!list.length&&!form)return"";
  return '<details id="payd" class="card"'+(PAYO?' open':'')+'><summary style="cursor:pointer;font-weight:600">Alınan ödemeler ('+list.length+')</summary><div style="height:10px"></div>'+form+list.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(p){
    if(ED==p.id)return editPay(p);return '<div class="card"><div class="row"><span><b>'+(showName?esc(sname(p.studentId))+' · ':"")+fd(p.date)+'</b> <span class="mut">'+esc(p.note||"")+'</span></span><span><b>'+tl(p.amount)+'</b> <button class="btn g s" data-a="edit" data-id="'+p.id+'">Düzenle</button> <button class="btn g s" data-a="delPay" data-id="'+p.id+'">Sil</button></span></div></div>';
  }).join("")+'</details>';
}
function sessionForm(s){
  if(!S.students.length)return '<p class="mut">Önce "Öğrenciler" sekmesinden öğrenci ekle.</p>';
  var opts=S.students.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join("");
  return '<div class="card"><h2>Yeni seans notu</h2>'+(s?'<input type="hidden" id="ss" value="'+s.id+'">':'<label>Öğrenci</label><select id="ss">'+opts+'</select>')+'<label>Tarih</label><input id="sd" type="date" value="'+(PRE?PRE.date:today())+'"><label>Bugün ne yaptık?</label> <button class="btn g s" data-a="mic" data-t="sx" type="button">🎤 Sesle yaz</button><textarea id="sx" placeholder="Konular, ödev, gözlemler, bir sonraki seans için plan...">'+(PRE?esc(PRE.note):'')+'</textarea>'+(s?'<input id="sfee" type="hidden" value="'+s.fee+'">':'<label>Seans ücreti (₺)</label><input id="sfee" type="number" inputmode="decimal">')+'<button class="btn" data-a="addSes">Seansı kaydet</button></div>';
}
function sessionList(list,showName){
  if(!list.length)return '<p class="mut">Henüz seans yok.</p>';
  return list.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(x){
    if(ED==x.id)return editSes(x);return '<div class="card"><div class="row"><b>'+(showName?esc(sname(x.studentId))+' · ':"")+fd(x.date)+'</b><span>'+(showName?tl(x.fee)+' ':'')+'<button class="btn g s" data-a="edit" data-id="'+x.id+'">Düzenle</button> <button class="btn g s" data-a="delSes" data-id="'+x.id+'">Sil</button></span></div><div class="notes">'+esc(x.notes)+'</div></div>';
  }).join("");
}
function money(){
  var ses=S.sessions.filter(function(x){return inR(x.date)}),pay=S.payments.filter(function(x){return inR(x.date)});
  var ciro=sum(ses),al=sum(pay),kalan=sum(S.sessions)-sum(S.payments);
  var h='<div class="card"><div class="fl"><div><label>Başlangıç</label><input type="date" id="ff" value="'+F.from+'"></div><div><label>Bitiş</label><input type="date" id="ft" value="'+F.to+'"></div></div><button class="btn g s" data-a="rng" data-r="month">Bu ay</button> <button class="btn g s" data-a="rng" data-r="prev">Geçen ay</button> <button class="btn g s" data-a="rng" data-r="year">Bu yıl</button> <button class="btn g s" data-a="rng" data-r="all">Tümü</button></div>';
  h+='<div class="grid"><div class="stat"><span class="mut">Ciro (seanslar)</span><b>'+tl(ciro)+'</b></div><div class="stat"><span class="mut">Alınan ödemeler</span><b>'+tl(al)+'</b></div><div class="stat"><span class="mut">Toplam kalan alacak</span><b>'+tl(kalan)+'</b></div></div><p class="mut">Seçili dönemde yapılan seans: <b>'+ses.length+'</b></p><p class="mut">Ciro, seans tarihine göre; alınan ödemeler, ödeme tarihine göre hesaplanır. "Toplam kalan alacak" tarih filtresinden bağımsızdır.</p>';
  var mo={};S.sessions.forEach(function(x){var k=x.date.slice(0,7);(mo[k]=mo[k]||{c:0,a:0}).c+=+x.fee||0});S.payments.forEach(function(x){var k=x.date.slice(0,7);(mo[k]=mo[k]||{c:0,a:0}).a+=+x.amount||0});

  else if(a=="cxl"){S.exc.push({id:uidn(),studentId:b.dataset.s,date:b.dataset.ds,t:b.dataset.t,to:"",nt:""})}

  else if(a=="doOcc"){PRE={date:b.dataset.ds,note:b.dataset.n||"",id:b.dataset.pid||null};view="students";sel=b.dataset.s;render();setTimeout(function(){var t4=$("sx");if(t4)t4.scrollIntoView({block:"center"})},50);return}
  else if(a=="addSlot"){var st2=S.students.find(function(z){return z.id==sel});(st2.slots=st2.slots||[]).push({d:+$("slD").value,t:$("slT").value||"",from:$("slF").value||today()});SLO=true}
  else if(a=="delSlot"){var st5=S.students.find(function(z){return z.id==sel}),sl5=st5.slots[+id];if((sl5.from||"")>=today())st5.slots.splice(+id,1);else sl5.to=pd(today());SLO=true}
  else if(a=="chSlot"){CH=+id;SLO=true;render();return}
  else if(a=="cancelCh"){CH=null;SLO=true;render();return}
  else if(a=="saveCh"){var st6=S.students.find(function(z){return z.id==sel}),sl6=st6.slots[+id],ef=$("chF").value||today(),nd6=+$("chD").value,nt6=$("chT").value||"";if(ef<=(sl6.from||"")){sl6.d=nd6;sl6.t=nt6}else{sl6.to=pd(ef);st6.slots.push({d:nd6,t:nt6,from:ef})}CH=null;SLO=true}
  else if(a=="sv"){SV=b.dataset.d;render();return}
  else if(a=="toggleAct"){var t3=S.students.find(function(z){return z.id==(id||sel)});t3.active=(t3.active===false);if(!id)SV=t3.active===false?"p":"a";sel=null;toast(t3.active===false?"Öğrenci pasif yapıldı":"Öğrenci aktif yapıldı")}
  else if(a=="settings"){view="settings";sel=null;render();return}
  else if(a=="closeSet"){view="students";render();return}
  else if(a=="edit"){ED=id;render();return}
  else if(a=="cancel"){ED=null;render();return}
  else if(a=="saveSes"){var q=S.sessions.find(function(z){return z.id==id});q.date=$("eD").value||q.date;q.notes=$("eT").value;ED=null}
  else if(a=="savePay"){var q2=S.payments.find(function(z){return z.id==id}),am2=+$("eA").value;if(!am2)return alert("Tutar gir.");q2.amount=am2;q2.date=$("eD").value||q2.date;q2.note=$("eN").value.trim();ED=null}
  else if(a=="saveFee"){S.students.find(function(z){return z.id==id}).fee=+$("uf"+id).value||0;status("Ücret güncellendi ✓")}
  else if(a=="doPlan"){var pp=S.plans.find(function(q){return q.id==id});if(pp){PRE=pp;view="students";sel=pp.studentId}render();setTimeout(function(){var t2=$("sx");if(t2)t2.scrollIntoView({block:"center"})},50);return}

  else if(a=="backup"){dlText("koc-takip-yedek-"+today()+".json",JSON.stringify(S,null,1),"application/json");return}

  else if(a=="day"){SD=b.dataset.d;render();setTimeout(function(){var e2=$("daypanel");if(e2)e2.scrollIntoView({behavior:"smooth",block:"nearest"})},50);return}

  save();render();
});
